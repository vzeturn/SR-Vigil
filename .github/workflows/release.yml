name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet tool install --global wix
      - run: cargo install cargo-cyclonedx --locked
      - name: Build MSI (unsigned; see docs/13-release.md for signing)
        env:
          # Repository variable (not a secret): the public URL of the shared AI endpoint. Empty = no shared option.
          VIGIL_PROXY_URL: ${{ vars.VIGIL_PROXY_URL }}
          # Optional override of the signed version catalogue endpoint (defaults to the project Worker).
          VIGIL_CATALOGUE_URL: ${{ vars.VIGIL_CATALOGUE_URL }}
        run: ./installer/build.ps1 -Version ${{ startsWith(github.ref_name, 'v') && github.ref_name || '0.0.0' }}
        shell: pwsh
      - name: SBOM
        run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: vigil-release
          path: |
            dist/*.msi
            dist/*.sha256
            **/*.cdx.json

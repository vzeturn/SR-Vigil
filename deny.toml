# cargo-deny policy. Advisory/ban/license failures break CI; exceptions must be explicit and time-boxed.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path (never published to crates.io).
allow-wildcard-paths = true

# Dependency graph from docs/02 §2: core depends on no other Vigil crate.
# store/ipc/ai depend only on core; the checks below are enforced by `xtask`-independent tests in CI.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

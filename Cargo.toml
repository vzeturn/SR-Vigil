[workspace]
resolver = "2"
members = [
  "crates/vigil-core",
  "crates/vigil-store",
  "crates/vigil-ipc",
  "crates/vigil-ai",
  "crates/vigil-win",
  "crates/vigil-svc",
  "crates/vigilctl",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Versions are pinned here; member crates opt in with `dep.workspace = true`.
# Re-check the latest compatible versions at M0 and commit Cargo.lock.
[workspace.dependencies]
anyhow = "1"
winreg = "0.55"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
dashmap = "6"
secrecy = "0.10"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
clap = { version = "4", features = ["derive"] }
windows = "0.58"
windows-service = "0.7"
ferrisetw = "1"
maxminddb = "0.24"
insta = { version = "1", features = ["json"] }
proptest = "1"
jsonschema = "0.26"

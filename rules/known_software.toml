# Well-known desktop software, recognised by executable name (plus optional vendor text in the
# file's own version resource). Recognition is a label and a modest score bonus (KNOW-001), and it
# only counts when the file sits in a system or Program Files path, so a copy dropped into a
# user-writable folder under the same name earns nothing.
#
# names   - executable file names, case-insensitive
# vendors - optional; when the file declares a company/product, one of these must appear in it


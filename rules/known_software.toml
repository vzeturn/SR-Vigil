names = ["cxaudmsg64.exe", "cxaudiosvc.exe"]
vendors = ["conexant", "synaptics"]

[[software]]
label = "Poly (Polycom) Lens"
what = "Headset management service"
names = ["polyp15windowsupdateservice.exe"]
vendors = ["poly", "plantronics", "hp"]

[[software]]
label = "Intel Graphics"
what = "Intel graphics driver helper"
names = ["igfxem.exe", "igfxhk.exe", "igfxcuiservice.exe"]
vendors = ["intel"]

[[software]]
label = "Conexant Audio"
what = "Conexant audio driver utility service"
names = ["cxutilsvc.exe"]
vendors = ["conexant", "synaptics"]

[[software]]
label = "Poly Hub"
what = "Headset management software from Poly (Plantronics)"
names = ["plantronicshub.exe", "polylens.exe", "polylensservice.exe"]
vendors = ["poly", "plantronics"]

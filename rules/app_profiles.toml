# Application profiles: how well-known multi-process programs look when they are healthy.
#
# [[browser]] - engines whose tabs run in their own "renderer"/"content" process. A renderer is
#   sandboxed and never starts another program; one that does has been compromised, and only that
#   one process (and what it started) is stopped, never the browser (docs/19 section 3).
#   names  - executable file names, case-insensitive
#   engine - "chromium" (command line carries --type=renderer) or "gecko" (-contentproc ... tab)
#
# [[dev_source]] - where a package installed by uv/pip/pipx says it comes from. A match is a modest
#   score bonus (PKG-001), never a verdict on its own: the metadata is written by the package
#   author, so it is evidence of origin, not proof (docs/19 section 5).
#   prefix - lower-case URL prefix found in the package's Home-page / Project-URL

[[browser]]
label = "Microsoft Edge"
names = ["msedge.exe"]
engine = "chromium"


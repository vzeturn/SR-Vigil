name = "NisSrv.exe"
canonical_paths = ["%ProgramData%\\Microsoft\\Windows Defender\\Platform\\*\\NisSrv.exe", "%ProgramFiles%\\Windows Defender\\NisSrv.exe"]
parent_check = false

# Standalone workspace: keeps the WebView2/Tauri toolchain out of `cargo test --workspace`.
[workspace]

[package]
name = "vigil-ui"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tauri-plugin-notification = "2"
tracing = "0.1"
vigil-ipc = { path = "../../../crates/vigil-ipc" }

[target.'cfg(windows)'.dependencies]
vigil-win = { path = "../../../crates/vigil-win" }

[features]
# Serve the bundled frontend instead of devUrl; `tauri dev` builds without default features.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
